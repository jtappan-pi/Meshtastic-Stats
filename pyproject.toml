[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", ".venv-win"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# server.py uses one-line `try: x  except: pass` bodies deliberately around BLE teardown.
ignore = ["E701", "E702"]

[tool.ruff.lint.per-file-ignores]
# The dashboard HTML/JS lives in a string inside server.py; its lines are long.
"server.py" = ["E501"]
